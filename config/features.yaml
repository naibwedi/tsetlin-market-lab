# Feature factory / target config.
panel_path: "data/panel/panel.parquet"
out_dir: "data/features"

# Which raw sources feed the panel. "**" = everything under data/raw/. To analyse
# one source cleanly (e.g. only Beat-The-Bookie), set "data/raw/btb_long/*.parquet".
raw_glob: "data/raw/**/*.parquet"

# Target for THIS book over the horizon.
#   mode: "moves"     -> does its fair p_home move by >= threshold (any direction)?
#         "converges"  -> does it move >= threshold *toward consensus*? (v0.3;
#                         rows already at consensus are dropped)
target:
  outcome: "home"
  move_threshold_prob: 0.005     # 0.5 implied-percentage-points
  horizon_snapshots: 1
  mode: "moves"

# Booleanization thresholds.
dispersion_high_quantile: 0.75
above_consensus_prob: 0.01
stale_snapshots: 3
kickoff_buckets_minutes: [15, 60, 180]
move_pct_bins: [0.01, 0.03]

# Reference ("sharp") books whose recent moves get their own lead/lag literals.
# For Beat-The-Bookie these must be among its 32 books.
reference_books: ["pinnacle", "betfair_ex_eu", "bet365", "williamhill"]

# Book-identity literals: "sharp" = only flag the reference books + a sharp/soft
# grouping (lets the model be book-aware without memorising every book's base
# rate); "all" = one-hot every book; "none" = no identity literals.
book_identity: "sharp"

anchor_only_pre_kickoff: true
min_books_per_snapshot: 4
