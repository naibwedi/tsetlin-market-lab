# Free self-collection poller config.
# Runs on a schedule (GitHub Actions cron or local task) and appends live odds
# snapshots to data/raw/live/.

adapters:
  - theoddsapi_free      # 500 credits/month free tier - paced, see below
  # - betfair             # enable only if you have a Betfair account + delayed key

theoddsapi_free:
  # FREE tier = 500 credits/month, reset on the 1st. Cost per run = one credit per
  # sport actually collected (1 region x 1 market). Three leagues at the paced
  # rate is about 5-6 runs a day.
  sports: ["soccer_epl", "soccer_spain_la_liga", "soccer_germany_bundesliga"]
  regions: "uk"          # used only when `bookmakers` is empty
  # Since 2026-08-30 the `uk` region alone dropped Pinnacle, Marathonbet and
  # Betfair EU from the stored snapshots - the sharp references the lead/lag
  # analysis needs. An explicit list of <= 10 books is billed as one region, so
  # keep the sharps plus a spread of softs for the same 1 credit per league.
  bookmakers: ["pinnacle", "betfair_ex_eu", "marathonbet", "matchbook", "smarkets",
               "williamhill", "betvictor", "ladbrokes_uk", "paddypower", "unibet_uk"]
  markets: "h2h"
  odds_format: "decimal"
  min_hours_to_commence: -3   # only events from 3h ago to 72h ahead count
  max_hours_to_commence: 72
  # Pacing: spend only while at or ahead of a linear burn-down of the month's
  # quota, and never below `reserve`. Uses the free /sports and /events endpoints,
  # so skipped runs cost nothing (international breaks used to burn ~1 in 4 credits).
  pace: true
  monthly_quota: 500
  reserve: 15

betfair:
  # See src/ingest/betfair.py docstring. Needs BETFAIR_USER / BETFAIR_PASS /
  # BETFAIR_APP_KEY (delayed) as env vars / GH secrets.
  event_type_id: "1"          # soccer
  competitions: []            # empty = all
  market_types: ["MATCH_ODDS"]

out_dir: "data/raw/live"
