# Free self-collection poller config.
# Runs on a schedule (GitHub Actions cron or local task) and appends live odds
# snapshots to data/raw/live/. Develop against synthetic data until this has
# banked a few weeks of real snapshots.

adapters:
  - theoddsapi_free      # 500 req/month free tier - keep the budget small
  # - betfair             # enable only if you have a Betfair account + delayed key

theoddsapi_free:
  # FREE tier = 500 credits/month. cost/run = len(sports) * n_regions * n_markets.
  # 1 sport x 1 region x 1 market = 1 credit/run. Every 2h => ~360/month. Safe.
  # Add sports/regions only if you move off the free tier or add a Betfair key.
  sports: ["soccer_epl"]
  regions: "uk"          # uk has the deepest EPL book coverage
  markets: "h2h"
  odds_format: "decimal"
  min_hours_to_commence: -3   # collect from 72h before until 3h after kickoff
  max_hours_to_commence: 72

betfair:
  # See src/ingest/betfair.py docstring. Needs BETFAIR_USER / BETFAIR_PASS /
  # BETFAIR_APP_KEY (delayed) as env vars / GH secrets.
  event_type_id: "1"          # soccer
  competitions: []            # empty = all
  market_types: ["MATCH_ODDS"]

out_dir: "data/raw/live"
