[project]
name = "tsetlin-market-lab"
version = "0.1.0"
description = "Tsetlin Sports Market Microstructure Lab - v0.1: predicting the next bookmaker movement"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# tmu builds C/CUDA extensions; install in WSL2 / Docker / Linux CI.
tm = ["tmu>=0.8"]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# optional-dependency guards deliberately catch broad exceptions
ignore = ["B904"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
