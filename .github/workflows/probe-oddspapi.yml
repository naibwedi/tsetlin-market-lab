name: probe-oddspapi

# One-off vetting of OddsPapi's free tier (about 8 of the 250 monthly requests).
# Prints a summary only; nothing is stored, because their storage terms are unknown.
# Setup: create a free key at oddspapi.io, add it as repo secret ODDSPAPI_KEY, then
# Actions -> probe-oddspapi -> Run workflow.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Probe
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m scripts.oddspapi_probe
