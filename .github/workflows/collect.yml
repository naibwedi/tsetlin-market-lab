name: collect-odds

# Free unattended odds collection. GitHub drops roughly two thirds of scheduled
# runs (measured: 4 a day delivered of 12 scheduled), so we schedule every 30
# minutes and let src/ingest/collect.py decide whether a run should spend
# anything. The Odds API FREE tier is 500 credits a month, reset on the 1st; the
# collector paces spending along a linear burn-down of that quota and skips
# leagues with nothing kicking off (both checks use free endpoints). A skipped
# run costs no credit and commits nothing.
#
# For real intraday spacing you need one of:
#   - a free Betfair delayed key (unlimited polling; set BETFAIR_* secrets and
#     enable the `betfair` adapter in config/collect.yaml)
#   - The Odds API paid tier (~$30/mo = 20k credits)
#
# Setup: repo secret ODDS_API_KEY.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas pyarrow requests pyyaml python-dotenv

      - name: Poll odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_USER: ${{ secrets.BETFAIR_USER }}
          BETFAIR_PASS: ${{ secrets.BETFAIR_PASS }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
        run: python -m src.ingest.collect --config config/collect.yaml

      - name: Commit new snapshots
        run: |
          git config user.name "odds-collector[bot]"
          git config user.email "actions@github.com"
          git add -f data/raw/live
          git diff --cached --quiet && exit 0
          git commit -m "collect: snapshot $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push retry $attempt"; sleep 5
          done
          exit 1
