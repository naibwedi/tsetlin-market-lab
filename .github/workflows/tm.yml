name: tsetlin

# Real Tsetlin Machine run on the green-tsetlin C++ engine (needs a compiler,
# which the Linux runner has). Manual trigger. Builds synthetic features unless
# real ones are committed under data/features/.

on:
  workflow_dispatch:
    inputs:
      n_matches:
        description: "synthetic matches (ignored if data/features/ exists)"
        default: "60"
      clauses:
        description: "number of clauses"
        default: "800"
      epochs:
        description: "training epochs"
        default: "40"

jobs:
  tsetlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]" && pip install "green-tsetlin==1.0.1"
      - name: green-tsetlin smoke test
        run: |
          python - <<'PY'
          import green_tsetlin as gt
          from green_tsetlin.dataset_generator import xor_dataset
          xtr, ytr, xte, yte = xor_dataset(n_literals=8, n_train=400, n_test=200)
          tm = gt.TsetlinMachine(n_literals=8, n_clauses=20, n_classes=2, s=3.0, threshold=15, literal_budget=4)
          tr = gt.Trainer(tm, n_epochs=10, seed=0, n_jobs=1, progress_bar=False)
          tr.set_train_data(xtr, ytr); tr.set_eval_data(xte, yte)
          print("smoke best_eval_score:", tr.train().get("best_eval_score"))
          PY

      - name: Build features if none committed
        run: |
          if [ ! -f data/features/X.parquet ]; then
            python -m src.ingest.make_synthetic --n-matches "${{ inputs.n_matches }}"
            python -m src.panel.build_panel --config config/features.yaml
            python -m src.features.booleanize --config config/features.yaml
          fi

      - name: Run Tsetlin
        run: |
          mkdir -p results
          python -m scripts.tm_gt --clauses "${{ inputs.clauses }}" --epochs "${{ inputs.epochs }}" \
            | tee results/tm_run.log

      - name: Summary
        run: |
          {
            echo '## Tsetlin result'
            echo '```json'; cat results/tm_result.json; echo '```'
            echo '## Top clauses'
            echo '```'; head -25 results/tm_clauses.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tsetlin-results
          path: |
            results/tm_result.json
            results/tm_clauses.txt
            results/tm_run.log
